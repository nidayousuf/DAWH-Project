apiVersion: 1
datasources:
  - name: Pharma DWH Postgres
    uid: pharma-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: postgres
    isDefault: true
    secureJsonData:
      password: postgres
    jsonData:
      database: pharma_dwh
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
